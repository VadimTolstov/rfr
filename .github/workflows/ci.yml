name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'hw/*'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      shared: ${{ steps.filter.outputs.shared }}
      api: ${{ steps.filter.outputs.api }}
      auth: ${{ steps.filter.outputs.auth }}
      e2e: ${{ steps.filter.outputs.e2e }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: master
          filters: |
            workflow:
              - '.github/workflows/ci.yml'
            shared:
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradle/**'
            api:
              - 'rfr-api/**'
            auth:
              - 'rfr-auth/**'
            e2e:
              - 'rfr-e2e/**'
            frontend:
              - 'rfr-gql-client/**'

  backend:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.auth == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build changed Gradle modules
        env:
          WORKFLOW: ${{ needs.changes.outputs.workflow }}
          SHARED: ${{ needs.changes.outputs.shared }}
          AUTH: ${{ needs.changes.outputs.auth }}
          API: ${{ needs.changes.outputs.api }}
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          tasks=()
          [[ $WORKFLOW == true ]] && SHARED=true
          [[ $SHARED == true || $AUTH == true ]] && tasks+=(:rfr-auth:build)
          [[ $SHARED == true || $API == true ]] && tasks+=(:rfr-api:build)
          [[ $SHARED == true || $E2E == true ]] && tasks+=(:rfr-e2e:compileTestJava)
          ./gradlew "${tasks[@]}"

  e2e:
    needs: changes
    if: |
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Playwright browsers and system dependencies
        run: ./gradlew :rfr-e2e:installPlaywrightWithDeps
      - name: Start auth service
        run: |
          setsid nohup ./gradlew :rfr-auth:bootRun > /tmp/rangiffler-auth.log 2>&1 < /dev/null &
          sleep 2
      - name: Wait for auth
        run: |
          timeout 120 bash -c "until curl -s -o /dev/null -w '%{http_code}' http://localhost:9001 | grep -qE '200|302|401'; do sleep 2; done"
          echo "Auth is up"
      - name: Start api service
        run: |
          setsid nohup ./gradlew :rfr-api:bootRun > /tmp/rangiffler-api.log 2>&1 < /dev/null &
          sleep 2
      - name: Install frontend dependencies and start development server
        run: nohup bash -c 'cd rfr-gql-client && npm ci && npm run dev -- --host 0.0.0.0' > /tmp/rangiffler-frontend.log 2>&1 < /dev/null &
      - name: Wait for services
        run: |
          echo "Waiting for services..."
          for port in 8081 3001; do
            echo "Waiting for port $port..."
            timeout 120 bash -c "until curl -s -o /dev/null -w '%{http_code}' http://localhost:$port | grep -qE '200|302|401'; do sleep 2; done"
            echo "Port $port is up"
          done
      - name: Run E2E tests
        run: ./gradlew e2e
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Auth log ==="
          cat /tmp/rangiffler-auth.log || true
          echo "=== API log ==="
          cat /tmp/rangiffler-api.log || true
          echo "=== Frontend log ==="
          cat /tmp/rangiffler-frontend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: rfr-e2e/build/allure-results
          retention-days: 7
          if-no-files-found: warn

  frontend:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
