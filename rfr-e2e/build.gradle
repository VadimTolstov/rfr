plugins {
    id 'io.qameta.allure' version '4.3.0'
}

group = 'io.student'
version = '1.0.0'

def allureJavaVersion = '3.0.0'
def allureReportVersion = '3.17.0'
def aspectJVersion = '1.9.25.1'
def flywayVersion = rootProject.project(':rfr-api').flywayVersion
def junitVersion = '6.1.3'
def playwrightVersion = '1.63.0'

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation platform("io.qameta.allure:allure-bom:$allureJavaVersion")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:4.1.1")

    testImplementation "io.qameta.allure:allure-jupiter"
    testImplementation "io.qameta.allure:allure-playwright"
    testImplementation "com.microsoft.playwright:playwright:$playwrightVersion"

    testImplementation "org.springframework:spring-jdbc"
    testImplementation "org.springframework.security:spring-security-crypto"
    testImplementation "org.flywaydb:flyway-core:$flywayVersion"
    testRuntimeOnly "org.flywaydb:flyway-mysql:$flywayVersion"
    testImplementation "com.zaxxer:HikariCP"
    testRuntimeOnly "com.mysql:mysql-connector-j"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-launcher"
    testImplementation "org.junit.platform:junit-platform-testkit"
    testRuntimeOnly "org.aspectj:aspectjrt:$aspectJVersion"
}


allure {
    version = allureReportVersion
    adapter {
        autoconfigure.set(false)
    }
}

def rfrSystemProperties = System.getProperties().findAll { key, value -> key.toString().startsWith('rfr.') }

tasks.withType(Test).configureEach {
    systemProperties rfrSystemProperties
    if (!rfrSystemProperties.containsKey('rfr.authMigrations') && !System.getenv('RFR_AUTH_MIGRATIONS')?.trim()) {
        systemProperty 'rfr.authMigrations', rootProject.file('rfr-auth/src/main/resources/db/migration/rangiffler-auth').absolutePath
    }
    if (!rfrSystemProperties.containsKey('rfr.apiMigrations') && !System.getenv('RFR_API_MIGRATIONS')?.trim()) {
        systemProperty 'rfr.apiMigrations', rootProject.file('rfr-api/src/main/resources/db/migration/rangiffler-api').absolutePath
    }
    jvmArgumentProviders.add({ ["-javaagent:${configurations.agent.singleFile}"] } as CommandLineArgumentProvider)
    outputs.upToDateWhen { false }
}

test {
    useJUnitPlatform()
    doFirst {
        if (filter.commandLineIncludePatterns.empty) {
            options { excludeTags 'ui' }
        }
    }
}

def waitForStand = tasks.register('waitForStand', Exec) {
    group = 'verification'
    description = 'Waits until MySQL, rfr-auth, rfr-api and the frontend respond'
    workingDir = rootProject.projectDir
    def bashExecutable = System.getenv('RFR_BASH') ?: System.getProperty('rfr.bash')
    if (!bashExecutable && System.getProperty('os.name').toLowerCase().contains('windows')) {
        def programFiles = System.getenv('ProgramFiles') ?: 'C:\\Program Files'
        def localAppData = System.getenv('LOCALAPPDATA') ?: ''
        bashExecutable = [
            new File(programFiles, 'Git/bin/bash.exe'),
            new File(localAppData, 'Programs/Git/bin/bash.exe')
        ].find { it.isFile() }?.absolutePath
    }
    commandLine bashExecutable ?: 'bash', 'scripts/wait-for-stand.sh'
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Runs UI tests against a running stand'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'rfr.migrationCheck', 'true'
    useJUnitPlatform {
        includeTags 'ui'
    }
    dependsOn waitForStand
}

tasks.register('installPlaywright', JavaExec) {
    group = 'playwright'
    description = 'Installs Playwright browsers'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install']
}

tasks.register('installPlaywrightWithDeps', JavaExec) {
    group = 'playwright'
    description = 'Installs Playwright browsers with system dependencies (for Ubuntu CI)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install', '--with-deps', 'chromium']
}
